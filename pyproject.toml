[project]
name = "deeplearning-llm"
version = "0.1.0"
description = "Python初心者・ML初心者向け 自作LLM教材（marimoノートブック）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.17",
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "regex>=2024.0",
    "tqdm>=4.66",
    "tiktoken>=0.7",
    "nbformat>=5.10",  # marimo export ipynb（Colab用notebook変換）に必要
]

[tool.uv]
# 学習データの再ダウンロードは download.sh で行う想定
package = false
